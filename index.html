// 重写console.log，同时输出控制台+存入日志数组
// 实现简易的printf格式化，处理 %s %d %j %o
function formatLogStr(fmt, ...args) {
    // 专门序列化 Map/Set 工具
    function stringifyValue(val) {
        if (val === null || val === undefined) {
            return String(val);
        }
        // Map 转为数组格式展示
        if (val instanceof Map) {
            const arr = [];
            for (const [k, v] of val) {
                arr.push([k, v]);
            }
            return `Map(${val.size}) ` + JSON.stringify(arr, null, 2);
        }
        // Set 转为数组
        if (val instanceof Set) {
            return `Set(${val.size}) ` + JSON.stringify([...val], null, 2);
        }
        // 普通对象、数组
        if (typeof val === 'object') {
            return JSON.stringify(val, null, 2);
        }
        return String(val);
    }

    if (typeof fmt !== 'string') {
        // 第一个参数不是字符串，直接全部拼接
        const allItems = [fmt, ...args];
        return allItems.map(stringifyValue).join(' ');
    }
    let argIdx = 0;
    // 支持 %s %d %f %j %o 常用占位符
    let output = fmt.replace(/%[sdjo]/g, (placeholder)=>{
        const val = args[argIdx++];
        const strVal = stringifyValue(val);
        if (placeholder === '%d' || placeholder === '%f') {
            return Number(val) || 0;
        }
        if(placeholder === '%j' || placeholder === '%o'){
            return JSON.stringify(val, null, 2);
        }
        return strVal;
    })
    // 剩下多余参数追加在后面
   if (argIdx < args.length) {
        const extraArgs = args.slice(argIdx).map(stringifyValue);
        output += ' ' + extraArgs.join(' ');
    }
    return output;
}

console.log = function (...args) {
    originalLog.apply(console, args);
    const text = formatLogStr(...args);
    logCache.push(text);
    resultBox.innerText = logCache.join('\n');
}

function filecheck_getNewname(fname)
{
    let fs = require('fs');
    let fp = require('path');
    let ename = fname, trycot = 1;
    let fpath = fp.join('./', ename);
    let fnamearr = ename.split('.');
    while (fs.existsSync(fpath)) {
        //文件已存在
        ename = `${fnamearr[0]}(${trycot}).${fnamearr[1]}`; 
        fpath = fp.join('./', ename);
        trycot++;
    }
    return ename;
}

function getNowTimeStr() {
  const date = new Date();
  const pad = n => String(n).padStart(2, '0');
  const y = date.getFullYear();
  const m = pad(date.getMonth() + 1);
  const d = pad(date.getDate());
  const h = pad(date.getHours());
  const mi = pad(date.getMinutes());
  const s = pad(date.getSeconds());
  return `${y}${m}${d}${h}${mi}${s}`;
}

function chineseToNumber(chineseStr) {
    const map = {
        '零': 0, '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9,
        '十': 10, '百': 100, '千': 1000, '万': 10000, '亿': 100000000
    };

    let total = 0;
    let section = 0;
    let curr = 0;

    for (const char of chineseStr) {
        const num = map[char];
        if (num === undefined) continue;

        if (num < 10) {
            curr = num;
        } else {
            if (curr === 0) curr = 1;
            section += curr * num;
            curr = 0;

            if (num === 10000 || num === 100000000) {
                total += section * num;
                section = 0;
            }
        }
    }
    total += section + curr;
    return total;
}

//转办次数区间内的各项工单数(a,b,c)---最低次数-最高次数-热点等级
function LevelCount(ipath, min, max, level)
{
    console.log("开始执行...");
    const filePath = path.resolve(ipath);
    const workbook = XLSX.readFile(filePath);
    const sheetNames = workbook.SheetNames;
    const targetSheet = sheetNames[0];
    const sheet = workbook.Sheets[targetSheet];
    const dataRange = XLSX.utils.decode_range(sheet['!ref']);
    const totalRows = dataRange.e.r + 1;
    const totalCols = dataRange.e.c + 1;
    const sheetdata = XLSX.utils.sheet_to_json(sheet, { header: 1 });

    var aim = "次转办";
    var levmap = new Map();
    var prounit_count = new Map();
    var c = level;
    var num = 0;
    for (var i = 1; i < totalRows; i++) {
        let eventcode = sheetdata[i][0];
        let textvalue = sheetdata[i][1];
        let prounit = sheetdata[i][14];
        if(prounit == '')
        {
            prounit = '无';
        }
        let levelsy = [sheetdata[i][30], sheetdata[i][31], sheetdata[i][32], sheetdata[i][33]];
        let textlength = textvalue.length;
        let pos = textvalue.indexOf(aim);
        if(pos != -1)
        {
            let pos1 = textvalue.lastIndexOf("（", pos - 1);
            if(pos - pos1 > 4)
            {
                pos1 = textvalue.lastIndexOf("(", pos - 1);
            }
            let count = chineseToNumber(textvalue.substring(pos1 + 1, pos + 3));
            //console.log("count:", count, textvalue, levelsy);
            if(count >= min && count <= max)
            {
                num++;
                //let maintext = GetMainText(textvalue);
                console.log("count:", count, eventcode, textvalue);
                if(levmap.has(levelsy[c-1]))
                {
                    levmap.set(levelsy[c-1], levmap.get(levelsy[c-1])+1);
                }
                else
                {
                    levmap.set(levelsy[c-1], 1);
                }
                if(prounit_count.has(prounit))
                {
                    prounit_count.set(prounit, prounit_count.get(prounit)+1);
                }
                else
                {
                    prounit_count.set(prounit, 1);
                }
            }
        }
    }

    console.log('\n总计%d件工单，所属%s类别%d种:', num, refer[c-1], levmap.size);
    let sortedArray = Array.from(levmap).sort((a, b) => b[1] - a[1]);
    for(let [a, b] of sortedArray)
    {
        console.log('%s:%s', a, b);
    }
    console.log('指定转办次数范围的转办工单处理部门分布如下所示：');
    let sorted = Array.from(prounit_count).sort((a, b) => b[1] - a[1]);
    for(let [a, b] of sorted)
    {
        console.log('%s:%s', a, b);
    }
    console.log("---执行结束---");
}

            //开始记录同名事件在表内记录的最大转办次数
            let maintext = GetMainText(textvalue);
            if(event_maxcount.has(maintext))
            {
                if(event_maxcount.get(maintext) < count)    //存在更高次转办的同一件事
                {
                    event_maxcount.set(maintext, count); 
                }
            }
            else
            {
                event_maxcount.set(maintext, count); 
            }
        }
    }

    let filteredData = sheetdata.slice(0, 1);
    for (var i = 1; i < totalRows; i++) {
        let eventcode = sheetdata[i][0];
        let textvalue = sheetdata[i][1];
        let prounit = sheetdata[i][14];
        if(prounit == '')
        {
            prounit = '无';
        }
        let levelsy = [sheetdata[i][30], sheetdata[i][31], sheetdata[i][32], sheetdata[i][33]];
        let textlength = textvalue.length;
        if(levelsy[c-1] == str)
        {
            let pos = textvalue.indexOf(aim);
            if(pos != -1)
            {
                let pos1 = textvalue.lastIndexOf("（", pos - 1);
                if(pos - pos1 > 4)
                {
                    pos1 = textvalue.lastIndexOf("(", pos - 1);
                }
                let count = chineseToNumber(textvalue.substring(pos1 + 1, pos + 3));
                if(count >= min && count <= max)
                {
                    let maintext = GetMainText(textvalue);
                    if(event_maxcount.get(maintext) == count)   //只输出是最大转办的同名事件
                    {
                        console.log("count:", count, eventcode, maintext);
                        //console.log(sheetdata[0][14], ":", prounit);
                        if(prounit_count.has(prounit))
                        {
                            prounit_count.set(prounit, prounit_count.get(prounit)+1);
                        }
                        else
                        {
                            prounit_count.set(prounit, 1);
                        }
                        filteredData.push(sheetdata[i]); //得有第一行作为表头才能aoa
                    }
                }
            }
        }
    }
    console.log('该热点的转办工单处理部门分布如下所示（已排除同名非最高转办次数的工单）：');
    let sorted = Array.from(prounit_count).sort((a, b) => b[1] - a[1]);
    for(let [a, b] of sorted)
    {
        console.log('%s:%s', a, b);
    }

    if(fc)
    {
        const newWorksheet = XLSX.utils.aoa_to_sheet(filteredData);
        //newWorksheet['!cols'][10] = [ { wch: 75 } ];
        //newWorksheet['!cols'] = Array(totalCols).fill({ wch: 50 });
        newWorksheet['!cols'] = [ { wch: 15 }, { wch: 50 }, { wch: 20 } ];
        const newWorkbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(newWorkbook, newWorksheet, '筛选结果');
        let ntime = getNowTimeStr();
        let resfilename = `${refer[lev-1]}_${name}_转办次数${min}-${max}次的筛选结果_${ntime}.xlsx`;
        let ename = filecheck_getNewname(resfilename);
        XLSX.writeFile(newWorkbook, ename);
        console.log('新表已生成：', ename);
    }
    console.log("---执行结束---");
}

//输出电话-工单数，参数为筛选的最小最大工单数，例如5，7，就是单人至少产生了5件工单，至多7件工单范围内的才显示
function CountRepAction(ipath, min, max, level, fc)
{
    console.log("开始执行...");
    const filePath = path.resolve(ipath);
    const workbook = XLSX.readFile(filePath);
    const sheetNames = workbook.SheetNames;
    const targetSheet = sheetNames[0];
    const sheet = workbook.Sheets[targetSheet];
    const dataRange = XLSX.utils.decode_range(sheet['!ref']);
    const totalRows = dataRange.e.r + 1;
    const totalCols = dataRange.e.c + 1;
    const sheetdata = XLSX.utils.sheet_to_json(sheet, { header: 1 });
    
    let result = ['电话', '工单数'];
    let mymap = new Map();
    for (var i = 1; i < totalRows; i++) {
        let eventcode = sheetdata[i][0];
        let telnumber = sheetdata[i][6];
        let levelsy = [sheetdata[i][30], sheetdata[i][31], sheetdata[i][32], sheetdata[i][33]];
        if(mymap.has(telnumber))
        {
            mymap.set(telnumber, mymap.get(telnumber) + 1);
        }
        else
        {
            mymap.set(telnumber, 1);
        }
    }
    if(min >= 2)
    {
        for(let [a, b] of mymap)
        {
            if(b < min || b > max)
            {
                mymap.delete(a);
            }
        }
    }
    // console.log(mymap);
    // let sorted = Array.from(mymap).sort((a, b) => b[1] - a[1]);
    for(let [a, b] of mymap)
    {
        console.log('电话号%s:%s件工单', a, b);
    }
    console.log('各人工单热点分布：');

    for(let [a, b] of mymap)
    {
        let text_count_map = new Map();
        const Secfiltered = sheetdata.filter((row, i) => {
            if (i === 0)    //表头还要么，返回true要，false不要
            {
                return false;
            }
            return row[6] === a;
        });
        for(var x = 0; x < Secfiltered.length; x++)
        {
            let leveltext = Secfiltered[x][30];
            for(var j = 1; j < level; j++)
            {
                leveltext = leveltext + '-' + Secfiltered[x][30+j];
            }
            if(text_count_map.has(leveltext))
            {
                text_count_map.set(leveltext, text_count_map.get(leveltext) + 1);
            }
            else
            {
                text_count_map.set(leveltext, 1);
            }
        }
        console.log('%s的工单种类:%d', a, text_count_map.size);
        for(let [key, value] of text_count_map) //或许可以把符合工单条件的每个人的表存下来？
        {
            console.log('%s:%d', key, value);
        }
        console.log('');
    }
    if(fc)
    {
        const filteredData = [ ['电话号', '工单数量'],  ...Array.from(mymap.entries())];
        const newWorksheet = XLSX.utils.aoa_to_sheet(filteredData);
        newWorksheet['!cols'] = [ { wch: 50 }, { wch: 30 }];
        const newWorkbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(newWorkbook, newWorksheet, '筛选结果');
        let ntime = getNowTimeStr();
        let resfilename = `同一联系人相关工单数为${min}-${max}件的筛选结果'_${ntime}.xlsx`;
        let ename = filecheck_getNewname(resfilename);
        XLSX.writeFile(newWorkbook, ename);
        console.log('新表已生成：%s', ename);
    }
    console.log("---执行结束---");
}

// ===================== 4. 统一执行入口：读取当前面板参数，调用对应函数 =====================
function executeFunc(funcId){
    let pathtext = document.getElementById('f0_filePath').value;
    if(!xlsxfilecheck(pathtext))
    {
        return;
    }
    let args = [];
    let targetFunc;
    const loadingTip = document.getElementById('loading-tip');
    const runButtons = document.querySelectorAll('.btn btn-run');
    clearLog();
    loadingTip.style.display = 'block';
    // 禁用所有执行按钮，避免重复触发
    runButtons.forEach(btn => btn.disabled = true);
    setTimeout(() => {
        try {
            switch(funcId){
                case 'func1':
                    args = [
                        document.getElementById('f0_filePath').value,
                        document.getElementById('f1_min').value,
                        document.getElementById('f1_max').value,
                        document.getElementById('f1_level').value
                    ];
                    args = inputcheckA(args);
                    targetFunc = LevelCount;
                    break
                case 'func2':
                    args = [
                        document.getElementById('f0_filePath').value,
                        document.getElementById('f2_min').value,
                        document.getElementById('f2_max').value,
                        document.getElementById('f2_level').value,
                        document.getElementById('f2_name').value
                    ];
                    args = inputcheckA(args);
                    targetFunc = LevelCount_ShowMax;
                    break
                case 'func3':
                    args = [
                        document.getElementById('f0_filePath').value,
                        document.getElementById('f3_min').value,
                        document.getElementById('f3_max').value,
                        document.getElementById('f3_level').value,
                        document.getElementById('f3_name').value,
                        document.getElementById('f3_fileCheck').checked
                    ]
                    args = inputcheckA(args);
                    targetFunc = LevelCount_OnlyShowMax;
                    break
                case 'func4':
                    args = [
                        document.getElementById('f0_filePath').value,
                        document.getElementById('f4_min').value,
                        document.getElementById('f4_max').value,
                        document.getElementById('f4_level').value,
                        document.getElementById('f4_fileCheck').checked
                    ]
                    args = inputcheckA(args);
                    targetFunc = CountRepAction;
                    break
                default:
                    console.log("未识别的功能ID");
                    return;
            }
            // 发送到主进程调度执行
            targetFunc(...args);
        }
        catch (err) {
            console.log("【执行异常】%s\n堆栈：%s", err.message, err.stack);
        } finally {
            const loadingTip = document.getElementById('loading-tip');
            const runButtons = document.querySelectorAll('.btn btn-run');
            loadingTip.style.display = 'none';
            runButtons.forEach(btn => btn.disabled = false);
        }
    }, 50);
}
